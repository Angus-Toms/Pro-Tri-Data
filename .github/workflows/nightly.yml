name: Nightly

# Every night: copy the live DB down from the box, bring it up to date with
# main's code (scripts/build.sh), post to social, then ship main and the new
# DB to the box together, rolling both back if the site doesn't come up.
# Run it by hand with "full" ticked for the occasional clean recompute.
# All development happens on branches; whatever is on main ships tonight.

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC
  workflow_dispatch:
    inputs:
      full:
        description: Re-walk every race and recompute ratings from scratch (hours, not minutes)
        type: boolean
        default: false

# Never two builds against the box at once
concurrency:
  group: prod
  cancel-in-progress: false

permissions:
  contents: write  # commits the admin tools' Instagram handles and start lists

env:
  PROD: ptd@77.42.41.185
  DATA: /var/lib/ptd
  APP: /opt/ptd
  PYTHONUNBUFFERED: "1"
  # R2 through its S3 API: athlete images and static assets
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2: https://f61c89ac113621bb9826f323f757966b.r2.cloudflarestorage.com

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          pip install -q -r requirements.txt
          # The social cards render in headless Chromium
          playwright install --with-deps chromium

      - name: SSH to the box
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "77.42.41.185 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBFEgEd+idK8v/TSqTO8brxclnfxx/FlKmJ3uutAU3i4" > ~/.ssh/known_hosts

      # Accounts, comments and follows live only in the box's Postgres, so a
      # dump a night, kept 14 days, before anything new is deployed
      - name: Back up the users DB
        run: |
          ssh "$PROD" "mkdir -p $DATA/backups && pg_dump -Fc ptd_users > $DATA/backups/ptd_users-\$(date +%F).dump \
            && ls -1t $DATA/backups/ptd_users-*.dump | tail -n +15 | xargs -r rm"

      - name: Pull the live DB, images and admin entries
        run: |
          scp -q "$PROD:$DATA/ptd.duckdb" ptd_data/ptd.duckdb
          # The processed WebPs only (100MB), so image sync fetches new athletes alone
          mkdir -p ptd_data/athlete_imgs
          rsync -a "$PROD:$DATA/athlete_imgs/128" "$PROD:$DATA/athlete_imgs/512" ptd_data/athlete_imgs/
          # Instagram handles from /admin/instagram. Set the pending file aside
          # (the app starts a new one on its next save) unless a failed run
          # already did; it is only deleted once this run has committed it.
          ssh "$PROD" "cd $DATA && if [ ! -e instagram_pending.csv.pulled ] && [ -s instagram_pending.csv ]; then mv instagram_pending.csv instagram_pending.csv.pulled; fi"
          if ssh "$PROD" "test -e $DATA/instagram_pending.csv.pulled"; then
            scp -q "$PROD:$DATA/instagram_pending.csv.pulled" instagram_pending.csv
            python -c "from ptd_data import db; db.merge_instagram_pending('instagram_pending.csv')"
          fi
          # Long-course start lists from /admin/startlist, one JSON per event
          rsync -a "$PROD:$DATA/startlists_pending/" ptd_data/data/startlists/

      - name: Build
        run: scripts/build.sh ${{ inputs.full && '--full' || '' }}

      - name: Athlete images
        run: python -m ptd_data.sync_images

      # Before the deploy, so the social_posts rows it writes ship with the DB
      # and nothing is posted twice. A failure here never blocks the deploy;
      # races it missed are retried tomorrow.
      - name: Social posts
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: python -m social.scheduler

      - name: Static assets to R2
        run: |
          for d in css js; do
            aws s3 sync "static/$d" "s3://ptd-static-assets/$d" --endpoint-url "$R2" --only-show-errors \
              --cache-control "public, max-age=3600"
          done
          for d in imgs flags fonts; do
            aws s3 sync "static/$d" "s3://ptd-static-assets/$d" --endpoint-url "$R2" --only-show-errors \
              --cache-control "public, max-age=31536000, immutable"
          done

      - name: Deploy
        run: |
          scp -q ptd_data/ptd.duckdb "$PROD:$DATA/ptd.duckdb.new"
          # New athletes' images, raw JPEGs included so the box keeps a source to reprocess
          rsync -a --ignore-existing ptd_data/athlete_imgs/128 ptd_data/athlete_imgs/512 ptd_data/athlete_imgs/raw "$PROD:$DATA/athlete_imgs/"
          ssh "$PROD" "DATA=$DATA APP=$APP SHA=$(git rev-parse HEAD) bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP"
          OLD=$(git rev-parse HEAD)
          # The commit this DB was built with, not whatever main is by now
          git fetch -q origin main
          git merge -q --ff-only "$SHA"
          .venv/bin/pip install -q -r requirements.txt
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 .venv/bin/playwright install chromium
          cd "$DATA"
          mv ptd.duckdb ptd.duckdb.prev
          mv ptd.duckdb.new ptd.duckdb
          sudo systemctl restart ptd
          for i in $(seq 30); do
            sleep 2
            if curl -fsS -o /dev/null localhost:8000/; then echo "Live on ${SHA:0:8}."; exit 0; fi
          done
          echo "Site not up after the restart: rolling back to ${OLD:0:8} and the previous DB" >&2
          mv ptd.duckdb ptd.duckdb.failed
          mv ptd.duckdb.prev ptd.duckdb
          git -C "$APP" reset -q --hard "$OLD"
          sudo systemctl restart ptd
          exit 1
          EOF

      - name: Commit admin entries
        run: |
          # Collect start lists saved during the run too, and empty the box's
          # pending folder; they are built tomorrow from the repo
          rsync -a --remove-source-files "$PROD:$DATA/startlists_pending/" ptd_data/data/startlists/
          git add ptd_data/data/instagram.csv ptd_data/data/startlists
          if ! git diff --cached --quiet; then
            git -c user.name="ptd-nightly" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Nightly: admin Instagram handles and start lists"
            git pull -q --rebase --autostash origin main
            git push -q origin HEAD:main
          fi
          ssh "$PROD" "rm -f $DATA/instagram_pending.csv.pulled"
