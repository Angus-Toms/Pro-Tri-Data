{#- Shared email layout. Table-based with inline styles: the only layout Gmail
    and Outlook render reliably. Colours and type follow the site tokens. -#}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>{{ subject }}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#f4f4f2;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f2;">
<tr><td align="center" style="padding:32px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;color:#111827;">
    <tr><td style="background:#1a1a2e;border-radius:12px 12px 0 0;border-bottom:3px solid #e85d04;padding:16px 28px;">
      <a href="{{ site }}" style="text-decoration:none;color:#ffffff;">
        <img src="{{ logo }}" width="28" height="28" alt="" style="vertical-align:middle;border:0;">
        <span style="vertical-align:middle;margin-left:8px;font-size:16px;font-weight:800;letter-spacing:0.04em;color:#ffffff;">Pro Tri Data</span>
      </a>
    </td></tr>
    <tr><td style="background:#ffffff;border:1px solid #e5e7eb;border-top:0;border-radius:0 0 12px 12px;padding:32px 28px;">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td style="padding:20px 28px;font-size:12px;line-height:1.6;color:#9ca3af;text-align:center;">
      {% block footer %}{% endblock %}
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
