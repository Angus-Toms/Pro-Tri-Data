{# Neutral follow button; users.js hydrates state from /me and handles clicks.
   Set follow_kind ('athlete'|'race') and follow_id before including. #}
<button type="button" class="btn-follow" data-follow-kind="{{ follow_kind }}" data-follow-id="{{ follow_id }}" aria-pressed="false">
    <svg class="follow-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21C7.2 17.5 2.5 13.6 2.5 9.3 2.5 6.4 4.7 4.5 7.2 4.5c1.9 0 3.6 1 4.8 2.7 1.2-1.7 2.9-2.7 4.8-2.7 2.5 0 4.7 1.9 4.7 4.8 0 4.3-4.7 8.2-9.5 11.7z"/>
    </svg>
    <span class="follow-label">Follow</span>
</button>
