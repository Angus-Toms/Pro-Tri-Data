{# Race like: a heart and its count, hidden at zero. On an upcoming race the
   like also asks for news: every start-list change, then the results.
   Set race_id, upcoming, and count (None when users.js fills it in). #}
<button type="button" class="race-like" data-follow-kind="race" data-follow-id="{{ race_id }}" aria-pressed="false"
        aria-label="Like this race"{% if upcoming %} title="Like to hear when the start list or results change" data-notify-on-like{% endif %}>
    <svg class="follow-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    <span data-follower-count="race:{{ race_id }}" data-hide-zero{% if not count %} hidden{% endif %}><span data-num>{{ count or 0 }}</span></span>
</button>
